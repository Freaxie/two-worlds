<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A dream reel in eleven shots, where the built world and the grown world trade places. Painted live; nothing is footage." />
    <meta name="theme-color" content="#050716" />
    <title>Blue Hour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="A looping dream reel: glass towers, flower meadows, cloud seas and upside-down oceans under a deep blue sky, seen through a fisheye lens."></canvas>
    <div id="ui" class="ui">
      <header class="mark">
        <h1>Blue Hour</h1>
        <span class="mono">A dream reel in eleven shots</span>
      </header>
      <footer class="foot">
        <div class="slate" aria-live="polite">
          <span id="shot-num" class="mono">01 / 11</span>
          <span id="shot-title" class="slate__title"></span>
          <div id="ticks" class="ticks" aria-hidden="true"></div>
        </div>
        <p class="note mono">Painted live, frame by frame. Nothing here is footage. Space pauses, arrows step.</p>
        <div class="transport">
          <button id="prev" type="button" aria-label="Previous shot">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h2v12H3zM14 2v12L6 8z" /></svg>
          </button>
          <button id="play" type="button" aria-label="Pause" data-state="playing">
            <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h4v12H3zM9 2h4v12H9z" /></svg>
            <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2v12l10-6z" /></svg>
          </button>
          <button id="next" type="button" aria-label="Next shot">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2h2v12h-2zM2 2v12l8-6z" /></svg>
          </button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/dream/main.ts"></script>
  </body>
</html>
